name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: stable-latest
            plugin: latest
            sdk: latest
          - baseline: tui-v2-candidate
            plugin: 0.0.0-tui-v2-202606261840
            sdk: 0.0.0-tui-v2-202606261840
    name: ${{ matrix.baseline }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install stable dependency graph
        run: bun install --frozen-lockfile

      - name: Overlay explicit OpenCode baseline
        env:
          OPENCODE_PLUGIN_VERSION: ${{ matrix.plugin }}
          OPENCODE_SDK_VERSION: ${{ matrix.sdk }}
        run: |
          replace_package() {
            name="$1"
            version="$2"
            destination="node_modules/$name"
            tarball=$(npm view "$name@$version" dist.tarball --registry=https://registry.npmjs.org)
            rm -rf "$destination"
            mkdir -p "$destination"
            curl --fail --silent --show-error --location "$tarball" \
              | tar -xz --strip-components=1 -C "$destination"
          }
          replace_package @opencode-ai/sdk "$OPENCODE_SDK_VERSION"
          replace_package @opencode-ai/plugin "$OPENCODE_PLUGIN_VERSION"
          node - <<'NODE'
          const fs = require("node:fs")
          for (const name of ["plugin", "sdk"]) {
            const path = `node_modules/@opencode-ai/${name}/package.json`
            console.log(`${name}: ${JSON.parse(fs.readFileSync(path, "utf8")).version}`)
          }
          NODE

      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - run: npm pack --dry-run
