name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: OpenCode 2.4.2 SDK
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install stable dependency graph
        run: bun install --frozen-lockfile

      - name: Verify OpenCode baseline
        run: test "$(node -p 'require("./node_modules/@opencode/plugin/package.json").version')" = "2.4.2"

      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - run: npm pack --dry-run
